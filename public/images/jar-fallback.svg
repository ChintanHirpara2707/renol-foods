<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <!-- Jar Glass & Shading Gradient -->
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Powder Core Gradient -->
    <linearGradient id="powderFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E84A38"/>
      <stop offset="50%" stop-color="#D63A2A"/>
      <stop offset="100%" stop-color="#9C2012"/>
    </linearGradient>

    <!-- Lid Gradient -->
    <linearGradient id="lidMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#283F33"/>
      <stop offset="40%" stop-color="#3A5546"/>
      <stop offset="60%" stop-color="#1B2B23"/>
      <stop offset="100%" stop-color="#14201A"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="jarShadow" x="-20%" y="-10%" width="140%" height="130%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feOffset dx="0" dy="24" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="200" cy="440" rx="120" ry="24" fill="#14201A" opacity="0.12"/>
  <ellipse cx="200" cy="438" rx="80" ry="14" fill="#14201A" opacity="0.18"/>

  <!-- Jar Body with Shadow -->
  <g filter="url(#jarShadow)">
    <!-- Base Powder Fill -->
    <rect x="110" y="160" width="180" height="240" rx="28" fill="url(#powderFill)"/>

    <!-- Powder Texture Accents -->
    <circle cx="160" cy="220" r="1.5" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="230" cy="280" r="2" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="140" cy="340" r="1" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="250" cy="360" r="1.8" fill="#FFFFFF" opacity="0.35"/>

    <!-- Glass Overlay -->
    <rect x="110" y="160" width="180" height="240" rx="28" fill="url(#jarGlass)"/>
    <rect x="110" y="160" width="180" height="240" rx="28" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Product Label -->
    <rect x="124" y="215" width="152" height="130" rx="10" fill="#FBF7EF" stroke="#14201A" stroke-opacity="0.1" stroke-width="1"/>
    
    <!-- Label Brand Monogram -->
    <rect x="184" y="228" width="32" height="20" rx="4" fill="#14201A"/>
    <text x="200" y="242" font-family="serif" font-weight="bold" font-size="11" fill="#FBF7EF" text-anchor="middle">RF</text>

    <!-- Label Typography -->
    <text x="200" y="268" font-family="serif" font-weight="bold" font-size="14" fill="#14201A" text-anchor="middle" letter-spacing="1">RENOL FOODS</text>
    <text x="200" y="284" font-family="sans-serif" font-weight="600" font-size="8.5" fill="#D63A2A" text-anchor="middle" letter-spacing="1.5">TOMATO POWDER</text>
    <line x1="150" y1="294" x2="250" y2="294" stroke="#14201A" stroke-opacity="0.15" stroke-width="0.8"/>
    <text x="200" y="308" font-family="sans-serif" font-weight="500" font-size="7.5" fill="#355042" text-anchor="middle">DEHYDRATED &bull; BAVLA, INDIA</text>
    <text x="200" y="324" font-family="sans-serif" font-weight="600" font-size="7" fill="#14201A" text-anchor="middle" opacity="0.6">NET WT: INDUSTRIAL PACK</text>

    <!-- Jar Neck / Thread -->
    <rect x="130" y="145" width="140" height="20" rx="6" fill="url(#lidMetal)"/>

    <!-- Jar Lid -->
    <rect x="120" y="115" width="160" height="34" rx="8" fill="url(#lidMetal)"/>
    <rect x="125" y="118" width="150" height="4" rx="2" fill="#FFFFFF" opacity="0.15"/>
    <line x1="120" y1="135" x2="280" y2="135" stroke="#14201A" stroke-width="1"/>
  </g>

  <!-- Ambient Light Reflection -->
  <path d="M126 175 Q122 280 126 380" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
</svg>
